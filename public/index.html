<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWS Location App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a2238; /* Background gelap */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            width: 420px;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .header-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #2b304a;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .divider {
            border: none;
            height: 1.5px;
            background-color: #2b304a;
            margin-bottom: 20px;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #2b304a;
            margin-bottom: 4px;
        }

        .user-nim {
            font-size: 15px;
            font-weight: 700;
            color: #2b3b6c;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .search-box button {
            background-color: #1e2436;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background-color: #2d3652;
        }

        .result-box {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 15px;
            text-align: left;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 13px;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 700;
            color: #2b304a;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .value {
            font-weight: 600;
            color: #333;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">PWS 29 September 2026</div>
        <hr class="divider">

        <div class="user-name">Izzul Maulanal Haqqi</div>
        <div class="user-nim">20240140166</div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari kota..." value="Bandung">
            <button onclick="searchLocation()">Search</button>
        </div>

        <div class="result-box">
            <div class="result-item">
                <span class="label">Negara</span>
                <span class="value" id="negara">-</span>
            </div>
            <div class="result-item">
                <span class="label">Provinsi</span>
                <span class="value" id="provinsi">-</span>
            </div>
            <div class="result-item">
                <span class="label">Kecamatan</span>
                <span class="value" id="kecamatan">-</span>
            </div>
            <div class="result-item">
                <span class="label">Longitude</span>
                <span class="value" id="longitude">-</span>
            </div>
            <div class="result-item">
                <span class="label">Latitude</span>
                <span class="value" id="latitude">-</span>
            </div>
        </div>
    </div>

    <script>
        async function searchLocation() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('negara').innerText = data.negara || '-';
                    document.getElementById('provinsi').innerText = data.provinsi || '-';
                    document.getElementById('kecamatan').innerText = data.kecamatan || '-';
                    document.getElementById('longitude').innerText = data.longitude || '-';
                    document.getElementById('latitude').innerText = data.latitude || '-';
                } else {
                    alert(data.message || 'Data tidak ditemukan');
                }
            } catch (error) {
                console.error('Error fetching location:', error);
            }
        }

        window.onload = searchLocation;
    </script>
</body>
</html>
